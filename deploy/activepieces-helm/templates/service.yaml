apiVersion: v1
kind: Service
metadata:
  name: {{ include "activepieces.fullname" . }}
  labels:
    {{- include "activepieces.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "activepieces.selectorLabels" . | nindent 4 }}
{{- if eq (.Values.workloadType | default "rollout") "rollout" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "activepieces.fullname" . }}-preview
  labels:
    {{- include "activepieces.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "activepieces.selectorLabels" . | nindent 4 }}
{{- end }}
